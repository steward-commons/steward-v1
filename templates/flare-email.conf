# Opt-in flare email for emergency coma. Default is off.
# Ask your human during setup. A local flare notice is always written.
# A flare email reply can never wake the house.
# When this is on, the kit queues one outbox file; a later turn sends it.
# This process does not open a mailbox.
flare_email: off
flare_email_to: <your human's address>
